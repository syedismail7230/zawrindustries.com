<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zawr Industries — You Are Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 560px; }
    .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 3rem; }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 600; letter-spacing: -0.02em; margin-bottom: 1rem; }
    p { font-size: 1.05rem; line-height: 1.7; color: rgba(255,255,255,0.6); font-weight: 300; margin-bottom: 2.5rem; }
    .btn {
      display: inline-block;
      padding: 0.9rem 2.25rem;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #ffffff;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
      background: transparent;
    }
    .btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.4); }
    .status { margin-top: 2rem; font-size: 0.8rem; color: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Zawr Industries</div>
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you have lost your internet connection.
      Some pages may still be available from cache.
      Connect to the internet and try again to access the full experience.
    </p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
    <div class="status">This page is served from your local device cache.</div>
  </div>
</body>
</html>
